<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Bootstrap Website</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">MyWebsite</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container my-5">
    <div class="card shadow border-0 p-4 text-center">
        <h1 class="mb-3 fw-bold">Welcome to Bootstrap</h1>
        <p class="text-muted">
            A simple and clean Bootstrap website for beginners.
        </p>

   
        <img src="https://picsum.photos/700/350" 
             class="img-fluid rounded mb-4"
             alt="Sample Image">

        

       
        <div class="mt-3">
            <button class="btn btn-primary px-4">Get Started</button>
            <button class="btn btn-outline-secondary px-4 ms-2">Learn More</button>
        </div>
    </div>
</div>


<footer class="bg-dark text-white text-center py-3">
    © 2026 MyWebsite | Designed with Bootstrap
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
